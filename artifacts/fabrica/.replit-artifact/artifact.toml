kind = "web"
previewPath = "/"
title = "Fábrica de Soluções"
version = "1.0.0"
id = "artifacts/fabrica"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20269

[services.development]
run = "pnpm --filter @workspace/fabrica run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fabrica", "run", "build" ]
publicDir = "artifacts/fabrica/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20269"
BASE_PATH = "/"
